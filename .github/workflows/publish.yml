name: Publish to Play Store

# Tag a release commit (git tag v2.0.1 && git push --tags) to build a signed AAB and ship it to the
# Play Store internal testing track. versionName/versionCode are set in app/build.gradle.kts.
on:
  push:
    tags:
      - 'v*'            # v2.0.0, v2.0.1, ...
  workflow_dispatch: {}  # allow manual runs from the Actions tab

permissions:
  contents: write        # create the GitHub release

jobs:
  publish:
    name: Build & publish release bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # The AdMob IDs are injected as manifest placeholders / BuildConfig fields by the
      # secrets-gradle-plugin, and secrets.defaults.properties is gitignored, so recreate it here.
      - name: Create secrets.defaults.properties
        run: |
          if [ -n "${{ secrets.SECRETS_DEFAULTS_PROPERTIES }}" ]; then
            echo "${{ secrets.SECRETS_DEFAULTS_PROPERTIES }}" | base64 --decode > secrets.defaults.properties
          else
            cat > secrets.defaults.properties <<'EOF'
          AD_ID="ca-app-pub-3940256099942544~3347511713"
          AD_BANNER="ca-app-pub-3940256099942544/6300978111"
          AD_BANNER_TEST="ca-app-pub-3940256099942544/6300978111"
          EOF
          fi

      # The release keystore is gitignored, so CI reconstructs it from a base64-encoded secret.
      - name: Restore release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Build the signed App Bundle. app/build.gradle.kts reads the keystore from these env vars and
      # uses it for the release signing config (falling back to debug signing when they are absent).
      - name: Build release bundle (AAB)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --no-configuration-cache

      - name: Upload to Google Play (closed testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.br.weightcontrol
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          # "alpha" is Google Play's default Closed testing track. If you use a custom-named
          # closed track, set this to that track's exact name from the Play Console.
          track: alpha
          status: completed

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/bundle/release/app-release.aab
